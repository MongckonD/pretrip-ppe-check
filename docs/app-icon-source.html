<!doctype html>

<script>
// ?square: full-bleed for iOS (the OS rounds the corners)
// ?maskable: full-bleed + artwork shrunk into the central safe zone, for Android / Chrome adaptive icons
if (/square|maskable/.test(location.search)) document.getElementById('bg').setAttribute('rx', '0');
if (location.search.includes('maskable')) document.getElementById('art').setAttribute('transform', 'translate(256 256) scale(0.78) translate(-256 -256)');
