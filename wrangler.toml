# Cloudflare config — Pre-Trip PPE Check
# Worker ตัวเดียวเสิร์ฟทั้งหน้าเว็บ (dist/) และ API (/api/*)
# deploy: npm run deploy
# ชื่อ Worker (เดิม pretrip-ppe-check — เปลี่ยนเป็น d-trip เมื่อ 2026-11-25)
name = "d-trip"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# เว็บจริง: https://dtrip.heyrockydev.com (โดเมนอยู่ในบัญชี Cloudflare เดียวกัน — Cloudflare สร้าง DNS + ใบรับรอง HTTPS ให้เอง)
# ลิงก์เดิม https://pretrip-ppe-check.pretrip-ppe-check.workers.dev ปิดแล้ว (2026-11-25) — เปิดกลับได้ด้วย workers_dev = true
workers_dev = false
routes = [
  { pattern = "dtrip.heyrockydev.com", custom_domain = true },
]

# หน้าเว็บ React ที่ build แล้ว (/api/* ไปที่ Worker ก่อน ที่เหลือเสิร์ฟไฟล์ตรง)
[assets]
directory = "./dist"
binding = "ASSETS"
# ทุกคำขอผ่าน Worker ก่อน: Worker เลือกหน้าตามสิทธิ์ (admin → /admin/ เท่านั้น, user → / เท่านั้น)
not_found_handling = "none"
run_worker_first = true

# Login: id_user + รหัสผ่าน จัดการโดยแอปเอง (worker/auth.ts) ไม่ใช้ Cloudflare Access
# ผู้ใช้คนแรก (admin) สร้างจากหน้า "ตั้งค่าครั้งแรก" ตอนที่ยังไม่มีผู้ใช้ในระบบ

# ล้างรูปที่อัปโหลดแล้วไม่ได้บันทึก (อายุเกิน 24 ชม.) ทุกวัน 03:00 เวลาไทย
[triggers]
crons = ["0 20 * * *"]

[observability]
enabled = true

# ฐานข้อมูลหลัก: ข้อมูลตรวจรถ / PPE / master
[[d1_databases]]
binding = "DB"
database_name = "pretrip-ppe"
database_id = "5db08867-16a6-4a47-8438-f510790be1b6"   # region APAC
migrations_dir = "cloudflare/migrations"

# ที่เก็บรูปถ่าย 6 มุมโดยเฉพาะ (private bucket — D1 เก็บแค่ r2_key)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pretrip-inspection-photos"

# ที่เก็บรูปใบขับขี่โดยเฉพาะ (private bucket แยกจากรูปตรวจรถ — D1 ตาราง driver_licenses เก็บแค่ photo_r2_key)
[[r2_buckets]]
binding = "LICENSES"
bucket_name = "pretrip-driver-licenses"

# store delivery (ร้านค้าที่ต้องส่ง): "1" = API on, anything else = 404 — on since version 1.1.0
# local development turns it on in .dev.vars
[vars]
FEATURE_STORE_DELIVERY = "1"
# store timer (จับเวลาร้านค้า, table store_visits): on since version 1.2.0
FEATURE_STORE_TIMER = "1"

# =====================================================================
# STAGING (เว็บทดสอบก่อนขึ้นจริง): https://dtrip-test.heyrockydev.com
#   Worker / ฐานข้อมูล / ที่เก็บรูป แยกจากเว็บจริงทั้งหมด — ทดลองอะไรก็ไม่กระทบข้อมูลจริง
#   deploy: npm run deploy:staging · ฐานข้อมูล: npx wrangler d1 ... pretrip-ppe-staging --env staging
# ค่าใน [env.staging] ต้องเขียนครบ (bindings / vars / routes ไม่สืบทอดจากด้านบน)
# =====================================================================
[env.staging]
name = "d-trip-staging"
workers_dev = false
routes = [
  { pattern = "dtrip-test.heyrockydev.com", custom_domain = true },
]

[env.staging.triggers]
crons = ["0 20 * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pretrip-ppe-staging"
database_id = "fdd0ffce-663e-4644-b0c9-ef442a92b834"   # region APAC
migrations_dir = "cloudflare/migrations"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "pretrip-inspection-photos-staging"

[[env.staging.r2_buckets]]
binding = "LICENSES"
bucket_name = "pretrip-driver-licenses-staging"

[env.staging.vars]
FEATURE_STORE_DELIVERY = "1"
FEATURE_STORE_TIMER = "1"
